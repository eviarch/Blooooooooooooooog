# 瀑布流相册数据文件
# 页面文件：source/masonry/index.md（front-matter 里的 template: masonry），访问路径 /masonry/
# 图片建议放在 source/masonry_images/ 下，这里的路径写成 /masonry_images/文件名.webp
#
# 字段说明：
#   image:       图片地址，本站路径（/masonry_images/x.webp）或完整外链 URL 都可以
#   title:       图片左上角标题，鼠标悬停时显示
#   description: 图片右下角描述，鼠标悬停时显示
#
# 注意事项：
#   1. 本文件不能为空，只剩注释也会让 masonry 页面渲染报错（theme.masonry 为 undefined）
#   2. 每一条 image 都必须真实存在，任意一张 404 会让整个瀑布流永远停在骨架屏
#   3. 增删条目时，记得同步增删 source/masonry_images/ 里的图片文件

